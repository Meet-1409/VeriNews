<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VeriNews — History</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<style>
  .search-wrap {
    flex: 1 1 280px; position: relative; display: flex; align-items: center;
  }
  .search-icon { position: absolute; left: 14px; pointer-events: none; }
  .search-input {
    width: 100%; min-height: 44px; padding: 0 14px 0 42px;
    border: 1px solid var(--input-b); border-radius: 10px;
    background: var(--surface); color: var(--ink); font: inherit;
  }
  .search-input:focus { border-color: var(--real-text); }

  .filter-pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .filter-pill {
    min-height: 36px; padding: 0 14px;
    border: 1px solid var(--input-b); border-radius: 999px;
    background: var(--surface); color: var(--ink);
    font: inherit; font-size: 14px; font-weight: 500;
    cursor: pointer; transition: all .15s;
  }
  .filter-pill.active {
    background: var(--primary); color: var(--primary-fg);
    border-color: var(--primary); font-weight: 600;
  }
  .filter-pill:hover:not(.active) { background: var(--soft); }

  .pane-layout {
    display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start;
  }
  .list-pane {
    flex: 3 1 400px; min-width: 0;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius-card); overflow: hidden;
  }
  .list-header {
    padding: 10px 18px; border-bottom: 1px solid var(--line);
    font-size: 13px; font-weight: 600; color: var(--muted);
  }
  .list-row {
    display: flex; flex-wrap: wrap; align-items: center;
    gap: 6px 14px; padding: 13px 18px;
    text-align: left; font: inherit; color: var(--ink);
    cursor: pointer; border: none;
    border-bottom: 1px solid var(--line);
    width: 100%; background: var(--surface);
    transition: background .12s;
  }
  .list-row:last-child { border-bottom: none; }
  .list-row:hover, .list-row.active { background: #F1F4FB; }
  .list-row.active { box-shadow: inset 3px 0 0 var(--primary); }
  .row-text { flex: 1 1 240px; min-width: 0; font-weight: 500; }
  .row-when { color: var(--muted); font-size: 13px; white-space: nowrap; }
  .row-pct  { font-size: 13px; color: var(--muted); white-space: nowrap; }

  .detail-pane {
    flex: 2 1 300px; min-width: 0;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius-card); padding: 22px;
    display: flex; flex-direction: column; gap: 16px;
  }
  .detail-title { font-size: 20px; font-weight: 600; line-height: 1.3; }
  .detail-dl {
    display: grid; grid-template-columns: auto 1fr;
    gap: 10px 16px; font-size: 14px;
    padding: 14px 0;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    margin: 0;
  }
  .detail-dt { color: var(--muted); }
  .detail-dd { margin: 0; font-weight: 600; }

  .empty-state { padding: 48px 18px; text-align: center; color: var(--muted); }
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a class="nav-logo" href="/">
      <svg aria-hidden="true" width="28" height="28" viewBox="0 0 28 28" fill="none">
        <rect width="28" height="28" rx="7" fill="#0F1728"/>
        <path d="M8 14.5l4 4 8-9" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      VeriNews
    </a>
    <div class="nav-tabs">
      <a class="nav-tab" href="/">Analyze</a>
      <a class="nav-tab active" href="/history" aria-current="page">History</a>
    </div>
    <a class="nav-cta" href="/">New check</a>
  </div>
</nav>

<main class="container" style="padding-top:40px;padding-bottom:72px;display:flex;flex-direction:column;gap:24px">

  <section>
    <h1 style="font-size:34px;margin-bottom:6px">History</h1>
    <p style="margin:0;color:var(--muted)">Every check you have run, stored locally on this machine.</p>
  </section>

  <section style="display:flex;flex-wrap:wrap;align-items:center;gap:12px" aria-label="Filters">
    <div class="search-wrap">
      <svg class="search-icon" aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" fill="none">
        <circle cx="8" cy="8" r="5.2" stroke="#4A5464" stroke-width="1.7"/>
        <path d="M12 12l3.5 3.5" stroke="#4A5464" stroke-width="1.7" stroke-linecap="round"/>
      </svg>
      <input class="search-input" id="search" type="search" placeholder="Search past checks" aria-label="Search past checks">
    </div>
    <div class="filter-pills" id="filters" role="group" aria-label="Filter by verdict">
      <button class="filter-pill active" data-filter="all">All</button>
      <button class="filter-pill" data-filter="fake">Likely fake</button>
      <button class="filter-pill" data-filter="real">Likely real</button>
      <button class="filter-pill" data-filter="uncertain">Uncertain</button>
    </div>
  </section>

  <div class="pane-layout">

    <div class="list-pane">
      <div class="list-header" id="list-header">Loading…</div>
      <div id="list-body">
        <div class="empty-state">Loading history…</div>
      </div>
    </div>

    <div class="detail-pane" id="detail-pane">
      <p style="color:var(--muted)">Select a check on the left to see details.</p>
    </div>

  </div>

</main>

<script>
let allItems = [];
let activeFilter = 'all';
let activeId     = null;

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function pillClass(label) {
  const l = (label||'').toLowerCase();
  return l==='fake'?'pill-fake': l==='real'?'pill-real':'pill-uncertain';
}
function pillText(label) {
  const l = (label||'').toLowerCase();
  return l==='fake'?'Likely fake': l==='real'?'Likely real':'Uncertain';
}
function fmtDate(iso) {
  if (!iso) return '';
  try {
    const d = new Date(iso + 'Z');
    const now = new Date();
    const diff = now - d;
    const time = d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
    if (diff < 86400000) return 'Today, ' + time;
    if (diff < 172800000) return 'Yesterday, ' + time;
    return d.toLocaleDateString([], {day:'numeric',month:'short'}) + ', ' + time;
  } catch { return iso; }
}

function getFiltered() {
  const q = (document.getElementById('search').value || '').trim().toLowerCase();
  return allItems.filter(item => {
    const labelMatch = activeFilter === 'all'
      || (activeFilter === 'fake' && item.label === 'Fake')
      || (activeFilter === 'real' && item.label === 'Real')
      || (activeFilter === 'uncertain' && item.label === 'Uncertain');
    const textMatch = !q || (item.text||'').toLowerCase().includes(q);
    return labelMatch && textMatch;
  });
}

function renderList() {
  const items = getFiltered();
  document.getElementById('list-header').textContent = items.length + ' of ' + allItems.length + ' checks';
  const body = document.getElementById('list-body');
  if (!items.length) {
    body.innerHTML = '<div class="empty-state">No checks match these filters.</div>';
    return;
  }
  body.innerHTML = items.map(item => {
    const fakeP = item.prob_fake != null ? Math.round(item.prob_fake * 100) : '—';
    return `<button class="list-row${item.id===activeId?' active':''}" data-id="${item.id}" type="button">
      <span style="min-width:112px"><span class="pill ${pillClass(item.label)}">${pillText(item.label)}</span></span>
      <span class="row-text">${escHtml((item.text||'').substring(0,100))}${(item.text||'').length>100?'…':''}</span>
      <span class="row-pct">Fake ${fakeP}%</span>
      <span class="row-when">${fmtDate(item.created_at)}</span>
    </button>`;
  }).join('');

  body.querySelectorAll('.list-row').forEach(btn => {
    btn.addEventListener('click', () => {
      activeId = Number(btn.dataset.id);
      renderList();
      showDetail(allItems.find(i => i.id === activeId));
    });
  });
}

function showDetail(item) {
  if (!item) { document.getElementById('detail-pane').innerHTML = '<p style="color:var(--muted)">Select a check on the left.</p>'; return; }
  const fakeP = item.prob_fake != null ? Math.round(item.prob_fake * 100) : null;
  const realP = item.prob_real != null ? Math.round(item.prob_real * 100) : null;
  const fb    = item.feedback || {};
  const fbText = fb.yes || fb.no ? (fb.yes ? 'Marked helpful' : 'Marked not helpful') : 'Not given';

  document.getElementById('detail-pane').innerHTML = `
    <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px">
      <span class="pill ${pillClass(item.label)}">${pillText(item.label)}</span>
      <span style="color:var(--muted);font-size:13px">${fmtDate(item.created_at)}</span>
    </div>
    <p class="detail-title">${escHtml((item.text||'').substring(0,200))}${(item.text||'').length>200?'…':''}</p>
    ${fakeP!==null ? `
    <div class="split-bar-wrap">
      <div class="split-labels">
        <span style="color:var(--fake-text);font-size:14px;font-weight:600">Fake ${fakeP}%</span>
        <span style="color:var(--real-text);font-size:14px;font-weight:600">Real ${realP}%</span>
      </div>
      <div class="split-bar" aria-label="Fake ${fakeP} percent, real ${realP} percent">
        <div class="split-bar-fake" style="width:${fakeP}%"></div>
        <div class="split-bar-real" style="flex:1"></div>
      </div>
    </div>` : ''}
    <dl class="detail-dl">
      <dt class="detail-dt">Model</dt>
      <dd class="detail-dd">${escHtml(item.model_key||'ensemble')}</dd>
      <dt class="detail-dt">Sources saved</dt>
      <dd class="detail-dd">${item.num_articles||0} articles</dd>
      <dt class="detail-dt">Your feedback</dt>
      <dd class="detail-dd">${escHtml(fbText)}</dd>
    </dl>
    <div style="display:flex;flex-wrap:wrap;gap:8px">
      <a href="/result?id=${item.id}" class="btn-primary" style="flex:1 1 140px;text-decoration:none">Open full result</a>
    </div>`;
}

// filters
document.getElementById('filters').addEventListener('click', e => {
  const btn = e.target.closest('.filter-pill');
  if (!btn) return;
  document.querySelectorAll('.filter-pill').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeFilter = btn.dataset.filter;
  renderList();
});

document.getElementById('search').addEventListener('input', renderList);

// load
(async () => {
  try {
    const r = await fetch('/api/history?limit=100');
    const d = await r.json();
    allItems = d.history || [];
    if (allItems.length) {
      activeId = allItems[0].id;
      renderList();
      showDetail(allItems[0]);
    } else {
      document.getElementById('list-header').textContent = '0 checks';
      document.getElementById('list-body').innerHTML = `
        <div class="empty-state">
          No checks yet. <a href="/">Run your first analysis →</a>
        </div>`;
    }
  } catch (e) {
    document.getElementById('list-body').innerHTML =
      '<div class="empty-state">Could not load history.</div>';
  }
})();
</script>
</body>
</html>
